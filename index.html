<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصروف الشهر</title>
<style>
  :root {
    --gold: #d4af37;
    --gold-dark: #b8912a;
    --gold-light: #f5e6b8;
    --bg: #141414;
    --card: #1f1f1f;
    --text: #f5f5f5;
    --muted: #a0a0a0;
    --danger: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
  header {
    background: linear-gradient(135deg, #1a1a1a, #2a2215);
    border-bottom: 2px solid var(--gold);
    padding: 20px 16px;
    text-align: center;
  }
  header h1 { color: var(--gold); font-size: 1.6rem; margin-bottom: 4px; }
  header p { color: var(--muted); font-size: 0.9rem; }
  .container { max-width: 760px; margin: 0 auto; padding: 16px; }

  .month-bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .month-bar input[type="month"] {
    background: var(--card); color: var(--text); border: 1px solid var(--gold-dark);
    border-radius: 8px; padding: 10px 12px; font-size: 1rem; flex: 1;
  }

  .summary { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .summary .card {
    flex: 1; min-width: 150px; background: var(--card); border: 1px solid var(--gold-dark);
    border-radius: 12px; padding: 14px; text-align: center;
  }
  .summary .card .label { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
  .summary .card .value { color: var(--gold); font-size: 1.4rem; font-weight: bold; }

  form#expense-form {
    background: var(--card); border: 1px solid var(--gold-dark); border-radius: 12px;
    padding: 16px; margin-bottom: 16px; display: grid; gap: 10px;
  }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .form-row > * { flex: 1; min-width: 130px; }
  input, select {
    background: #2a2a2a; color: var(--text); border: 1px solid #444; border-radius: 8px;
    padding: 10px 12px; font-size: 0.95rem; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--gold); }
  button {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #1a1a1a;
    border: none; border-radius: 8px; padding: 10px 18px; font-size: 1rem; font-weight: bold;
    cursor: pointer; width: 100%;
  }
  button:hover { filter: brightness(1.1); }
  button.secondary { background: #333; color: var(--text); border: 1px solid #555; font-weight: normal; }
  button.small { padding: 5px 12px; font-size: 0.8rem; width: auto; }

  .categories { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .cat-chip {
    background: var(--card); border: 1px solid var(--gold-dark); border-radius: 20px;
    padding: 6px 14px; font-size: 0.85rem; color: var(--text);
  }
  .cat-chip b { color: var(--gold); }

  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid #333; font-size: 0.9rem; }
  th { background: #262626; color: var(--gold); }
  tr:last-child td { border-bottom: none; }
  td.amount { color: var(--gold); font-weight: bold; white-space: nowrap; }
  td.date { color: var(--muted); white-space: nowrap; }
  td.actions { white-space: nowrap; }
  td.actions button { display: inline-block; width: auto; margin-inline-start: 6px; padding: 4px 10px; font-size: 0.75rem; }
  .btn-del { background: #5a2222; color: #ff9a9a; }
  .btn-edit { background: #333; color: var(--text); border: 1px solid #555; }

  .empty { text-align: center; color: var(--muted); padding: 30px 10px; background: var(--card); border-radius: 12px; }

  .bar-chart { display: grid; gap: 8px; margin-bottom: 16px; }
  .bar-row { display: grid; grid-template-columns: 110px 1fr 70px; gap: 8px; align-items: center; font-size: 0.85rem; }
  .bar-row .name { color: var(--muted); }
  .bar-row .track { background: #2a2a2a; border-radius: 6px; height: 14px; overflow: hidden; }
  .bar-row .fill { background: linear-gradient(90deg, var(--gold), var(--gold-light)); height: 100%; border-radius: 6px; }
  .bar-row .val { color: var(--gold); text-align: left; }

  @media (max-width: 480px) {
    .bar-row { grid-template-columns: 90px 1fr 60px; }
    th, td { padding: 8px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<header>
  <h1>📊 مصروف الشهر</h1>
  <p>نظّم مصاريفك: بنزين، كهربا، مي، المحل، معسل، فحم، غاز وأكثر</p>
</header>

<div class="container">

  <div class="month-bar">
    <input type="month" id="month-picker" onchange="render()">
  </div>

  <div class="summary">
    <div class="card">
      <div class="label">إجمالي الشهر</div>
      <div class="value" id="total-month">0</div>
    </div>
    <div class="card">
      <div class="label">عدد العمليات</div>
      <div class="value" id="count-items">0</div>
    </div>
  </div>

  <form id="expense-form" onsubmit="saveExpense(event)">
    <input type="hidden" id="edit-id" value="">
    <div class="form-row">
      <select id="exp-category" required>
        <option value="بنزين سيارة">⛽ بنزين سيارة</option>
        <option value="كهربا">💡 كهربا</option>
        <option value="مي">💧 مي</option>
        <option value="محل العرب">🏪 محل العرب</option>
        <option value="المحل الألماني (خضروات)">🥬 المحل الألماني (خضروات)</option>
        <option value="معسل">💨 معسل</option>
        <option value="فحم">🔥 فحم</option>
        <option value="غاز">🛒 غاز</option>
        <option value="غيره">📦 غيره</option>
      </select>
      <input type="number" id="exp-amount" placeholder="المبلغ" step="0.01" min="0" required>
    </div>
    <div class="form-row">
      <input type="text" id="exp-note" placeholder="ملاحظة (اختياري)">
      <input type="date" id="exp-date" required>
    </div>
    <div class="form-row">
      <button type="submit" id="btn-save">➕ إضافة مصروف</button>
      <button type="button" class="secondary" id="btn-cancel" style="display:none" onclick="resetForm()">إلغاء التعديل</button>
    </div>
  </form>

  <div class="bar-chart" id="bar-chart"></div>

  <div class="categories" id="cat-chips"></div>

  <table>
    <thead>
      <tr>
        <th>التصنيف</th>
        <th>المبلغ</th>
        <th>الملاحظة</th>
        <th>التاريخ</th>
        <th>إجراءات</th>
      </tr>
    </thead>
    <tbody id="exp-table"></tbody>
  </table>
  <div class="empty" id="empty-msg" style="display:none">لا يوجد مصاريف لهذا الشهر بعد 🌟</div>

</div>

<script>
const CATS = ["بنزين سيارة","كهربا","مي","محل العرب","المحل الألماني (خضروات)","معسل","فحم","غاز","غيره"];
const STORE_KEY = "expenses-v1";

function loadAll() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
  catch { return []; }
}
function saveAll(list) { localStorage.setItem(STORE_KEY, JSON.stringify(list)); }

function currentMonth() { return document.getElementById("month-picker").value; }

function monthItems() {
  const m = currentMonth();
  if (!m) return [];
  return loadAll().filter(e => e.date.startsWith(m));
}

function render() {
  const items = monthItems();
  const total = items.reduce((s, e) => s + Number(e.amount), 0);
  document.getElementById("total-month").textContent = fmt(total);
  document.getElementById("count-items").textContent = items.length;

  renderChips(items);
  renderBars(items);
  renderTable(items);
}

function fmt(n) {
  return new Intl.NumberFormat("ar", { maximumFractionDigits: 2 }).format(n) + " ل.ل";
}

function renderChips(items) {
  const box = document.getElementById("cat-chips");
  const sums = {};
  CATS.forEach(c => sums[c] = 0);
  items.forEach(e => { if (sums[e.category] !== undefined) sums[e.category] += Number(e.amount); });
  box.innerHTML = CATS.map(c =>
    `<span class="cat-chip">${c}: <b>${fmt(sums[c])}</b></span>`
  ).join("");
}

function renderBars(items) {
  const box = document.getElementById("bar-chart");
  const sums = {};
  CATS.forEach(c => sums[c] = 0);
  items.forEach(e => { if (sums[e.category] !== undefined) sums[e.category] += Number(e.amount); });
  const max = Math.max(...CATS.map(c => sums[c]), 1);
  box.innerHTML = CATS.map(c => `
    <div class="bar-row">
      <span class="name">${c}</span>
      <span class="track"><span class="fill" style="width:${(sums[c]/max*100).toFixed(1)}%"></span></span>
      <span class="val">${Intl.NumberFormat("ar",{maximumFractionDigits:0}).format(sums[c])}</span>
    </div>`).join("");
}

function renderTable(items) {
  const tbody = document.getElementById("exp-table");
  const empty = document.getElementById("empty-msg");
  const table = document.querySelector("table");
  tbody.innerHTML = "";
  if (items.length === 0) {
    table.style.display = "none";
    empty.style.display = "block";
    return;
  }
  table.style.display = "table";
  empty.style.display = "none";
  const sorted = [...items].sort((a, b) => b.date.localeCompare(a.date));
  sorted.forEach(e => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${e.category}</td>
      <td class="amount">${fmt(e.amount)}</td>
      <td>${e.note ? escapeHtml(e.note) : "—"}</td>
      <td class="date">${e.date}</td>
      <td class="actions">
        <button class="btn-edit" onclick="startEdit('${e.id}')">✏️ تعديل</button>
        <button class="btn-del" onclick="delExpense('${e.id}')">🗑️ حذف</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&": "&" + "amp;",
    "<": "&" + "lt;",
    ">": "&" + "gt;",
    '"': "&" + "quot;",
    "'": "&" + "#39;"
  })[c]);
}

function saveExpense(ev) {
  ev.preventDefault();
  const id = document.getElementById("edit-id").value;
  const exp = {
    id: id || crypto.randomUUID(),
    category: document.getElementById("exp-category").value,
    amount: parseFloat(document.getElementById("exp-amount").value),
    note: document.getElementById("exp-note").value.trim(),
    date: document.getElementById("exp-date").value
  };
  const all = loadAll();
  const idx = all.findIndex(e => e.id === exp.id);
  if (idx >= 0) all[idx] = exp; else all.push(exp);
  saveAll(all);
  resetForm();
  render();
}

function startEdit(id) {
  const e = loadAll().find(x => x.id === id);
  if (!e) return;
  document.getElementById("edit-id").value = e.id;
  document.getElementById("exp-category").value = e.category;
  document.getElementById("exp-amount").value = e.amount;
  document.getElementById("exp-note").value = e.note || "";
  document.getElementById("exp-date").value = e.date;
  document.getElementById("btn-save").textContent = "💾 حفظ التعديل";
  document.getElementById("btn-cancel").style.display = "inline-block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function delExpense(id) {
  if (!confirm("متأكد إنك بدك تحذف هالمصروف؟")) return;
  saveAll(loadAll().filter(e => e.id !== id));
  render();
}

function resetForm() {
  document.getElementById("expense-form").reset();
  document.getElementById("edit-id").value = "";
  document.getElementById("btn-save").textContent = "➕ إضافة مصروف";
  document.getElementById("btn-cancel").style.display = "none";
  setToday();
}

function setToday() {
  const now = new Date();
  const iso = new Date(now.getTime() - now.getTimezoneOffset()*60000).toISOString().slice(0,10);
  document.getElementById("exp-date").value = iso;
}

(function init() {
  const now = new Date();
  document.getElementById("month-picker").value = now.toISOString().slice(0,7);
  setToday();
  render();
})();
</script>
</body>
</html>
